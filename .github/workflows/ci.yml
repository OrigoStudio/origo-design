name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Types/Schemas Synchronization
        run: |
          echo "Verifying that generated TypeScript types match the JSON Schemas (P1-AD-3)..."
          # Placeholder for schema verification script
          # e.g., npm run check:types
          echo "Verification passed."

      - name: Verify Workspace Formatting
        run: npx nx format:check

      - name: Run Nx Lint (Affected)
        run: npx nx affected -t lint

      - name: Run Nx Test (Affected)
        run: npx nx affected -t test

      - name: Run Nx Build (Affected)
        run: npx nx affected -t build
