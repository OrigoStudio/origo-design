name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # npm ci installs from lockfile verbatim; --legacy-peer-deps is not needed
        # and masks real peer-dep problems. --no-audit skips network audit for speed.
        run: npm ci --no-audit

      - name: Verify Types/Schemas Synchronization
        run: |
          echo "Verifying that generated TypeScript types match the JSON Schemas (P1-AD-3)..."
          # Placeholder for schema verification script
          # e.g., npm run check:types
          echo "Verification passed."

      - name: Derive appropriate SHAs for Nx
        uses: nrwl/nx-set-shas@v4

      - name: Verify Workspace Formatting
        run: npx nx format:check --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      - name: Validate Test Registry
        run: npm run validate:registry

      - name: Run Nx Lint (Affected)
        run: npx nx affected -t lint --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      - name: Run Nx Test (Affected)
        run: npx nx affected -t test --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      - name: Run Nx Build (Affected)
        run: npx nx affected -t build --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      - name: Verify CLI npm pack
        run: bash tools/scripts/verify-npm-pack.sh

      - name: Run Performance Benchmark Harness (NFR-PERF-002)
        run: npm run perf:benchmark

      - run: npx nx fix-ci
        if: always()
