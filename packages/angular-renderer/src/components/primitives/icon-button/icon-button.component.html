<button
  type="button"
  [disabled]="computedDisabled()"
  [attr.aria-label]="computedAriaLabel()"
  [attr.aria-describedby]="computedAriaDescribedBy()"
  [title]="contract().props.tooltip || null"
  (click)="onClick()"
>
  @if (computedLoading()) {
    <span class="origo-spinner"></span>
  } @else {
    @if (computedIcon()) {
      <span [class]="'origo-icon origo-icon-' + computedIcon()"></span>
    } @else {
      <span class="origo-icon origo-icon-default"></span>
    }
  }
</button>
