# tools/test-registry/test-registry.yaml
# Central Test Case Ledger — origo-design
# Schema Version: 1.0
# ==========================================
# FIELD DEFINITIONS:
#   id:               Unique kebab-case identifier
#   description:      One-line human description of what the test suite verifies
#   package:          Nx package / app name (@origo/cli, @origo/core, @origo/design-tokens, @origo/angular-renderer, @origo/playground, @origo/devtools, origo-e2e, tools)
#   spec_file:        Repo-root-relative path using POSIX forward slashes
#   type:             unit | e2e | integration | perf
#   affected_stories: Non-empty list of story keys that introduced or modified this spec
#   last_result:      pass | fail | skipped | unknown (baseline: unknown)
#   results:          Map of release tag -> pass | fail | skipped
# ==========================================
# TEST ISOLATION PATTERNS (Enforced per Epic 8):
#   - Global mocks (e.g. global.chrome) must be scoped inside beforeEach().
#   - Cleanup (e.g. vi.restoreAllMocks, jest.restoreAllMocks) must run in afterEach().
#   - Simulated DOM states (document.body.innerHTML) must be reset in afterEach().
#   - Test states passed via bridges must be cloned (via structuredClone) to prevent cyclic pollution.
# ==========================================

